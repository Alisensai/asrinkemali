# ==============================================================================
# ASRIN KEMALİ — MKA FORTRESS X V1.1
# Sertleştirilmiş Nginx Ters Vekil (Hardened Reverse Proxy Configuration)
# ==============================================================================
# Bağımsız sunucu, VPS veya bare-metal dağıtımlarda Next.js önünde güvenli katman.
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Bilgi Sızıntısını Önleme
    server_tokens off;

    # 2. Loglama Formatı (Gizlilik Dostu Anonymized IP)
    log_format fortress_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip_hash":"$binary_remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log fortress_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # 3. Buffer Taşması (Buffer Overflow) ve Slowloris Saldırı Korumaları
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 4 8k;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Performans Ayarları
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip Sıkıştırma (BREACH saldırısını önlemek için dinamik gizli çerezli yanıtlarda kapatılabilir)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # 4. Hız Sınırlama Bölgeleri (Rate Limiting Zones)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=12r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=3r/s;
    limit_req_status 429;

    # Upstream Next.js Uygulama Kümesi
    upstream nextjs_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 5. HTTP -> HTTPS Yönlendirmesi
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name asrinkemali.org www.asrinkemali.org;
        return 301 https://$host$request_uri;
    }

    # 6. Güvenli HTTPS Sunucu Bloğu
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name asrinkemali.org www.asrinkemali.org;

        # TLS Sıkılaştırma (Yalnızca TLS 1.3 ve TLS 1.2 Strict)
        ssl_certificate /etc/ssl/certs/asrinkemali.crt;
        ssl_certificate_key /etc/ssl/private/asrinkemali.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Temel Güvenlik Başlıkları
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Kötü Niyetli HTTP Metotlarını Engelle
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 405;
        }

        # Hassas Dosya ve Dizin Taramalarını Engelle
        location ~* (/\.git|/\.env|/\.aws|/\.ssh|/wp-admin|/wp-login|/phpmyadmin|\.bak$|\.sql$) {
            deny all;
            return 404;
        }

        # Sağlık Uç Noktaları (Rate limit'e takılmaz, önbelleğe alınmaz)
        location ~ ^/(api/health|api/ready)$ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Statik Varlıklar (Agresif Önbellekleme, Hız Sınırlamasız)
        location ~ ^/(_next/static|assets)/ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Arama ve Dinamik Rotalar (Sıkı Hız Sınırlaması)
        location ~ ^/(arsiv|arastirma|kronoloji|api/search) {
            limit_req zone=search_limit burst=5 nodelay;
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Genel Sayfalar (Standart Hız Sınırlaması)
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Acil Durum / BLACKOUT Statik Sayfa Yönlendirmesi
        error_page 502 503 504 /blackout.html;
        location = /blackout.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
