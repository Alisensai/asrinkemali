# ==============================================================================
# ASRIN KEMALİ — MKA FORTRESS X V1.1
# Linux Çekirdek Sertleştirme Parametreleri (sysctl.conf)
# ==============================================================================
# Standart: CIS Linux Benchmark Seviye 2 Uyumlu Ağ ve Bellek Koruma
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. IP Sahteciliği (IP Spoofing) ve Yönlendirme Korumaları
# ------------------------------------------------------------------------------
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Kaynak tabanlı paket yönlendirmesini engelle (Source Routing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# IP Yönlendirmeyi (IP Forwarding) kapat (Sunucu router değildir)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# ------------------------------------------------------------------------------
# 2. ICMP Saldırı ve Yeniden Yönlendirme Korumaları
# ------------------------------------------------------------------------------
# ICMP Redirect paketlerini reddet
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Smurf saldırısı ve broadcast ping engelleme
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Şüpheli (Martian) paketleri günlüğe kaydet
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ------------------------------------------------------------------------------
# 3. TCP SYN Flood ve DDoS Sıkılaştırma
# ------------------------------------------------------------------------------
# SYN Cookies zorunlu kıl (SYN flood saldırısında bağlantı kuyruğu dolunca devreye girer)
net.ipv4.tcp_syncookies = 1

# SYN backlog ve bağlantı kuyruğu kapasitesini artır
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096

# Saldırı anında askıda kalan bağlantıların zaman aşımını kısalt
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_fin_timeout = 15

# TIME_WAIT durumundaki soketlerin güvenli yeniden kullanımı
net.ipv4.tcp_tw_reuse = 1

# ------------------------------------------------------------------------------
# 4. Bellek ve Çekirdek Güvenliği (Exploit Mitigations)
# ------------------------------------------------------------------------------
# Tam Adres Alanı Düzeni Rastgeleleştirme (ASLR - Seviye 2)
kernel.randomize_va_space = 2

# Çekirdek işaretçilerinin (kptr) sızdırılmasını engelle
kernel.kptr_restrict = 2

# dmesg çekirdek tamponuna root olmayan kullanıcı erişimini kısıtla
kernel.dmesg_restrict = 1

# BPF JIT sertleştirmesi
net.core.bpf_jit_harden = 2

# Ptrace kısıtlaması (İşlemlerin birbirinin belleğini okumasını engelle)
kernel.yama.ptrace_scope = 2

# Dosya tanımlayıcı sınırları
fs.file-max = 2097152
